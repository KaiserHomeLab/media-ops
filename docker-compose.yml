# Media Ops with Docker Compose. Works as-is on Linux, Windows (Docker Desktop), macOS,
# Synology (Container Manager), Portainer and Unraid's Compose Manager plugin.
# Start it from the folder this file is in:  docker compose up -d
# Then open http://<this-computer's-ip>:8484
# Step-by-step guides for each platform: docs/install.md
services:
  media-ops:
    image: ghcr.io/kaiserhomelab/media-ops:latest
    container_name: media-ops
    restart: unless-stopped
    environment:
      - PUID=1000 # run `id` on Linux to see yours. Unraid: 99. Synology: your user's uid.
      - PGID=1000 # Unraid: 100. Synology: 100 (users). Windows and Mac: leave as is.
      - TZ=America/Chicago # your time zone
      - HOST_NAME=media-server # the name shown at the top of the dashboard
      # The container list, through the read-only proxy below (it can only list containers).
      - DOCKER_HOST=tcp://socket-proxy:2375
      # Behind a reverse proxy or Cloudflare Tunnel? Uncomment so the settings-login lockout
      # counts each visitor, not the proxy. Leave it off without one (anyone could fake the header).
      # - TRUST_PROXY=1
    depends_on:
      - socket-proxy
    ports:
      - '8484:8484'
    volumes:
      # Settings folder. "./config" is created next to this file and works on every OS.
      # Unraid: /mnt/user/appdata/media-ops   Synology: /volume1/docker/media-ops
      - ./config:/config

      # Not recommended: mounting the Docker socket directly. ":ro" doesn't limit what can be
      # asked of Docker, so anything that took over Media Ops would control your host. If you
      # use it anyway, remove DOCKER_HOST above and the socket-proxy service below.
      # - /var/run/docker.sock:/var/run/docker.sock:ro

      # Optional: disks to show free space for. Mount read-only, then list the
      # right-hand path under Settings → General → Disks to show.
      # Linux:    - /mnt/media:/mnt/media:ro
      # Windows:  - D:\Media:/mnt/media:ro   (the free space shown is the whole D: drive's)
      # macOS:    - /Volumes/Media:/mnt/media:ro
      # Unraid:   - /mnt/user:/mnt/user:ro
      # Synology: - /volume1:/volume1:ro

  # Optional: lets the dashboard list your containers and find your apps in Docker, without
  # Media Ops touching the Docker socket. This proxy answers only "list containers"; everything
  # else (start, stop, exec, create) is refused, and it isn't published outside this file.
  # Delete this service (and DOCKER_HOST, depends_on above) if you don't want the container list.
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: media-ops-socket-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1 # the one thing Media Ops asks for
      - POST=0 # read-only
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro # rootless Docker or Podman: see docs/install.md
    read_only: true
    tmpfs:
      - /run
