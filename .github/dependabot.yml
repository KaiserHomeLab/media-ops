# Weekly update PRs, grouped so each ecosystem is one PR. Every PR runs the full CI.
version: 2
updates:
  # The pinned GitHub Actions in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'ci'

  # The base image (pinned to a digest in the Dockerfile)
  - package-ecosystem: docker
    directory: /src
    schedule:
      interval: weekly
    commit-message:
      prefix: 'docker'

  # Development tools only (ESLint, Prettier); the app has no runtime dependencies
  - package-ecosystem: npm
    directory: /src
    schedule:
      interval: weekly
    groups:
      dev-tools:
        patterns: ['*']
    # @types/node describes one Node major; it tracks the oldest Node we support (engines in
    # src/package.json), so a newer major would let code use APIs that version doesn't have.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'dev'
