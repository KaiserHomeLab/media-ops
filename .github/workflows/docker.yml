#
# CI for every pull request and every push to main:
#   lint    ESLint and Prettier (formatting)
#   test    the unit and server tests, on the Node versions we support
#   build   builds the image and smoke-tests it (starts it, checks it serves the dashboard);
#           on main and on version tags it then publishes the multi-arch image to
#           ghcr.io/<owner>/media-ops with a signed provenance attestation. Only runs when
#           lint and test passed.
#   release on a version tag (v1.2.3): creates the GitHub release, with the notes from
#           CHANGELOG.md. See CONTRIBUTING.md → Releasing.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; only the build job can publish packages. Actions are pinned to
# exact commits, so a moved tag can't change what runs with the publishing token.
permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      # The app has no runtime dependencies, so the tests need no install step.
      - run: npm test

  build:
    name: build
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # sign the provenance attestation (Sigstore, via GitHub's OIDC token)
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Version tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="v$(jq -r .version package.json)"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json ($want)"; exit 1; }
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/media-ops
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - id: info
        run: |
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version package.json)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # Smoke test: build the image for this machine, start it, and check it answers and serves
      # a dashboard before anything is published. Uses the demo data, so no apps are needed.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: media-ops:smoke
          cache-from: type=gha
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8484:8484 -e DEMO=1 media-ops:smoke
          for i in $(seq 1 30); do curl -fsS http://localhost:8484/healthz && break; sleep 2; done
          curl -fsS http://localhost:8484/healthz
          curl -fsS http://localhost:8484/ | grep -q '<title>'
          curl -fsS -o /dev/null -w '%{content_type}' http://localhost:8484/js/main.js | grep -q javascript
          curl -fsS http://localhost:8484/api/overview | jq -e '(.services | length) > 0 and .version != null'
          curl -fsS http://localhost:8484/settings | grep -q 'Settings'
      - name: Container log
        if: always()
        run: docker logs smoke || true
      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          build-args: |
            BUILD_DATE=${{ steps.info.outputs.date }}
            VERSION=${{ steps.info.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Published with a signed record of how and from what it was built (SLSA provenance)
          # and a list of every package inside (SBOM): `docker buildx imagetools inspect`.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Verifiable by anyone: gh attestation verify oci://ghcr.io/kaiserhomelab/media-ops:<tag> -R KaiserHomeLab/media-ops
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        if: github.event_name != 'pull_request'
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/media-ops
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    name: release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The section from "## [1.2.3]" up to the next "## [" heading.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::No section for $version in CHANGELOG.md"; exit 1; }
          printf '\n**Image:** `ghcr.io/kaiserhomelab/media-ops:%s`\n' "$version" >> notes.md
          cat notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "Media Ops ${GITHUB_REF_NAME#v}" --notes-file notes.md
