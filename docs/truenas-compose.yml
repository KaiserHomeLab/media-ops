# TrueNAS 24.10+: Apps → Discover Apps → ⋮ → Install via YAML, then paste this.
# Change "tank" to your pool's name. Afterwards, in Media Ops: Settings → General → Disk paths
# → /mnt/tank, and Settings → Add app → TrueNAS for pools, disks and alerts.
services:
  media-ops:
    image: ghcr.io/kaiserhomelab/media-ops:latest
    container_name: media-ops
    restart: unless-stopped
    environment:
      - PUID=568 # TrueNAS's "apps" user
      - PGID=568 # TrueNAS's "apps" group
      - TZ=America/Chicago
      - HOST_NAME=truenas # name shown in the header
      - DOCKER_HOST=tcp://socket-proxy:2375 # the container list, through the read-only proxy below
    depends_on:
      - socket-proxy
    ports:
      - '8484:8484'
    volumes:
      - /mnt/tank/apps/media-ops:/config # create this dataset/folder first
      - /mnt/tank:/mnt/tank:ro # optional: pool usage and forecast

  # Optional: the container list without giving Media Ops the Docker socket. It only answers
  # "list containers". Delete it (and DOCKER_HOST, depends_on above) if you don't want the list.
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: media-ops-socket-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /run
