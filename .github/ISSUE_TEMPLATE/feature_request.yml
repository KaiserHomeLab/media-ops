    id: problem
    attributes:
      label: What would you like to see?
      description: What are you trying to do, and what's missing today?
    validations:
      required: true
  - type: textarea
    id: apps
    attributes:
      label: Which apps are involved?
      description: For example Sonarr, Plex, Unraid.
